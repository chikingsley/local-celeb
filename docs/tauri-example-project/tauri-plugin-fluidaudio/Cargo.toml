[package]
name = "tauri-plugin-fluidaudio"
version = "0.1.0"
authors = [ "You" ]
description = "Tauri plugin for FluidAudio - local ASR and speaker diarization"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-fluidaudio"

[dependencies]
tauri = { version = "2.9.3" }
serde = "1.0"
serde_json = "1.0"
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
swift-rs = "1.0"

[build-dependencies]
tauri-plugin = { version = "2.5", features = ["build"] }

[target.'cfg(target_os = "macos")'.build-dependencies]
swift-rs = { version = "1.0", features = ["build"] }
